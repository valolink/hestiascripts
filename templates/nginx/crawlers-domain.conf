# Valolink 2026-10-01: crawler handling, maps in /etc/nginx/conf.d/valolink-crawlers.conf.
# Installed per domain as /home/<user>/conf/web/<domain>/nginx.ssl.conf_crawlers
# (Hestia includes nginx.ssl.conf_* at server level; survives rebuilds).
# Remove this file and reload nginx to lift all of it.

# Listing permutations: send crawlers to the plain (cached) page.
if ($vl_crawler_trap) { return 301 https://$host$vl_path; }

# Consent tracker and cart refresh: nothing to do for a crawler.
if ($vl_crawler_noop) { return 204; }

# Uncached requests: 30/min per crawler family, 2/s per visitor IP.
limit_req zone=vl_crawler burst=20 nodelay;
limit_req zone=vl_ip      burst=40 nodelay;
limit_req_status 429;
