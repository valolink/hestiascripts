# Valolink: a default Cache-Control for HTML responses that carry none.
#
# Deployed to /etc/nginx/conf.d/valolink-html-cache-control.conf by
# setup/install-html-cache-control.sh (run from install-scripts.sh, so
# v-hestiascripts-update rolls it out, or from run.sh -> 12).
#
# WHY THIS EXISTS
# ---------------
# The wp-rocket proxy template answers a cache hit with `try_files $rocket_file`,
# i.e. nginx serves WP Rocket's pre-built page as a plain static file. Static
# files get ETag and Last-Modified and *no* Cache-Control at all.
#
# A response with a validator but no freshness information does not mean "do not
# cache". RFC 9111 4.2.2 explicitly permits a heuristic lifetime, and every major
# browser uses ~10% of the document's age: a page built a week ago is held for
# ~17 hours and reused without ever asking the server again.
#
# For WooCommerce that is a correctness bug rather than a tuning question. The
# cached HTML embeds wcBlocksMiddlewareConfig.storeApiNonce, and a WordPress
# nonce lives 24 hours. Once a browser-held copy outlives its nonce, the Store
# API rejects the request and the cart / mini-cart stop hydrating until the
# visitor hard-refreshes -- which is the one thing a customer will not do.
#
# Diagnosed on energiatuote.fi 2026-09-02. That site had this header for years:
# LiteSpeed's LSCache always sends `no-cache, must-revalidate, max-age=0` on
# HTML. The guarantee was lost in the move to nginx, and nothing replaced it.
#
# SCOPE
# -----
# Declared at http level so it reaches every vhost on the box, including the
# stock Hestia proxy templates -- they have the same gap, it just costs less
# there. nginx drops *all* inherited add_header directives at any level that
# declares its own, so a server or location block with its own add_header opts
# itself out. None of the Valolink templates do.
#
# Deliberately not in wp-rocket.tpl: a $variable referenced by a domain template
# whose map is missing is a config-parse error, and nginx would refuse to start
# on any box that got the template but not this file. Keeping both halves in one
# file makes that failure impossible.

# 1. Is this response HTML? Matches "text/html" and "text/html; charset=UTF-8".
map $sent_http_content_type $vl_is_html {
    default       0;
    ~*^text/html  1;
}

# 2. HTML *and* nothing has set Cache-Control already? The map source is the two
#    values joined by a colon, so "1:" means "HTML, Cache-Control empty".
#
#    This only ever fills a gap, it never overrides:
#      - WordPress sends its own Cache-Control on cart / checkout / my-account
#        (`no-cache, must-revalidate, max-age=0, private`) via @backend. Left
#        alone -- appending a second header would merge into one comma-joined
#        list per RFC 9110 5.3 and could clobber a deliberate max-age.
#      - `expires max` in the asset location sets one on static files. Also left
#        alone, though the content-type guard above already excludes those.
#
#    nginx omits add_header entirely when its value is an empty string, which is
#    what makes this a conditional without needing `if`.
map "$vl_is_html:$sent_http_cache_control" $vl_html_cache_control {
    default  "";
    "1:"     "no-cache, must-revalidate, max-age=0";
}

# `always` so error pages are covered too -- a 404 is HTML and equally must not
# be pinned in a browser cache.
#
# no-cache means "store it, but revalidate before reuse", NOT "do not store":
# the ETag still earns cheap 304s, so this costs a conditional request, not
# bandwidth. no-store would be the directive that forbids keeping a copy.
#
# `private` is intentionally omitted -- it would also stop a CDN from caching
# HTML, which is a separate decision from fixing browser heuristic caching.
add_header Cache-Control $vl_html_cache_control always;
