    # --- START: Valolink security rules ---

    # Code assets: long cache only when the URL can actually be busted.
    #
    # The stock asset block (nested inside `location /`) ends with
    # `expires max`, i.e. ten years with no revalidation, whether or not the URL
    # carries a version. For an asset enqueued without one that is a trap: the
    # URL never changes, so a plugin update swaps the bytes on disk and every
    # returning browser keeps executing its old copy. A normal reload does not
    # help — it revalidates the document but serves subresources from cache
    # while their max-age holds — so the only fix a visitor has is a hard
    # refresh. That is the wp-admin "broken until I hard-refresh" report.
    #
    # This is a top-level regex location, so it wins over the prefix `location /`
    # and its nested block. $vl_asset_expires is `max` when the URL carries
    # ?ver= and 1h when it does not; it is declared at http level in
    # /etc/nginx/conf.d/valolink-cache-headers.conf, which MUST be installed
    # before this template is rebuilt or nginx will not start.
    #
    # @fallback, not =404: unlike fonts and images below, css/js are genuinely
    # generated by PHP on some sites.
    location ~* \.(?:css|js|mjs)$ {
        root       %docroot%;
        try_files  $uri @fallback;

        access_log /var/log/%web_system%/domains/%domain%.log combined;
        access_log /var/log/%web_system%/domains/%domain%.bytes bytes;

        expires    $vl_asset_expires;
    }

    # Fonts and images that are not on disk.
    #
    # Hestia's default proxy template ends its static-asset block with
    # `try_files $uri @fallback`, so a MISSING asset is handed to Apache, where
    # WordPress's front controller turns it into a full themed 404. Measured on
    # kuumalahde 2026-08-28: a missing slick.woff cost 219KB of PHP-rendered
    # HTML, ~6,200 times over 5 days (3.7GB), because a carousel plugin ships
    # CSS referencing fonts it does not include. Those were real browsers, not
    # bots. This location is a regex, so it wins over the prefix `location /`
    # and its nested block, and answers the miss here for a few hundred bytes.
    #
    # css/js are deliberately absent from this list: some plugins genuinely
    # generate those through PHP, and a =404 would break them. Fonts and images
    # effectively never are. If a site does serve a generated .png or .svg from
    # PHP, add a more specific location for that path above this one.
    location ~* \.(?:woff2?|ttf|otf|eot|svg|gif|png|jpe?g|webp|avif|ico)$ {
        root       %docroot%;
        try_files  $uri =404;

        access_log /var/log/%web_system%/domains/%domain%.log combined;
        access_log /var/log/%web_system%/domains/%domain%.bytes bytes;

        expires    max;
    }

    location ~ /\.(?!well-known\/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (?:\.(?:bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op])|~)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    if ($http_user_agent ~* (SemrushBot|AhrefsBot|MJ12bot|DotBot|PetalBot|MegaIndex|HTTrack|masscan)) {
        return 403;
    }

    # --- END: Valolink security rules ---

