# Valolink 2026-10-01: crawler handling (http context).
#
# Declares the maps and limit zones only; a domain opts in by including
# /home/<user>/conf/web/<domain>/nginx.ssl.conf_crawlers, which uses them.
#
# Why: Meta's AI crawler (meta-externalagent) and PerplexityBot crawl the
# Avada sort/count/view permutations of every product listing, ignoring
# robots.txt. Every query string skips the WP Rocket page cache, so each of
# those URLs costs ~0.9 CPU-seconds, and the crawler's headless browser adds
# two more uncached calls per page view (Complianz consent tracker, WooCommerce
# cart refresh). On a 2-core box that saturated PHP for hours.

# Crawler family: the product token of a self-declared crawler user agent
# ("meta-externalagent", "PerplexityBot", "Googlebot", "facebookcatalog").
# Empty for browsers. Requiring "/" after the token keeps phone models such
# as "CUBOT X30" out.
map $http_user_agent $vl_crawler {
    default "";
    "~*(?<vl_fam>[a-z0-9_.-]*(?:bot|agent|crawler|spider|externalhit|catalog))/" $vl_fam;
}

# Path without the query string, for redirects.
map $request_uri $vl_path {
    default $uri;
    "~^(?<vl_p>[^?]*)" $vl_p;
}

# A crawler asking for a listing permutation (sort, count, view; Avada and
# Zuka parameter names) or an add-to-cart link. The same page exists without
# the arguments, cached.
map "$vl_crawler|$args" $vl_crawler_trap {
    default 0;
    "~^[^|]+\|(?:.*&)?(?:product_orderby|product_order|product_view|product_count|orderby|per_page|add-to-cart)=" 1;
}

# Background calls a crawler's headless browser makes on every page view:
# the Complianz consent banner/tracker and the WooCommerce cart refresh.
# Each one boots WordPress; none of them means anything for a crawler, and
# the consent tracker would only count crawlers as visitors.
map "$vl_crawler|$uri|$args" $vl_crawler_noop {
    default 0;
    "~^[^|]+\|/wp-json/complianz/" 1;
    "~^[^|]+\|/\|(?:.*&)?wc-ajax=get_refreshed_fragments" 1;
}

# Static files are served by nginx even with a ?ver= argument.
map $uri $vl_static {
    default 0;
    "~*\.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|bmp|woff2?|ttf|otf|eot|map|mp4|webm|mp3|pdf|zip)$" 1;
}

# Uncached = reaches PHP: any query string or a non-GET, on a non-static path.
map "$vl_static|$request_method|$args" $vl_uncached {
    default 1;
    "~^1\|" 0;
    "~^0\|(?:GET|HEAD)\|$" 0;
}

map $http_cookie $vl_logged_in {
    default 0;
    "~wordpress_logged_in_" 1;
}

# Crawlers: uncached requests limited per family, not per IP (Meta crawls
# from dozens of addresses). Cached pages are never limited.
map "$vl_uncached|$vl_crawler" $vl_crawler_limit_key {
    default "";
    "~^1\|(?<vl_fam_key>.+)$" $vl_fam_key;
}

# Everyone else: uncached requests limited per IP. This is the zone the
# fail2ban jail vl-hammer watches. Exempt: crawlers (limited above), logged-in
# WordPress users, and the box itself (WP cron, Action Scheduler loopbacks).
map "$vl_uncached|$vl_crawler|$vl_logged_in|$remote_addr|$server_addr" $vl_ip_limit_key {
    default "";
    "~^1\|\|0\|([^|]+)\|\1$" "";
    "~^1\|\|0\|" $binary_remote_addr;
}

limit_req_zone $vl_crawler_limit_key zone=vl_crawler:1m  rate=30r/m;
limit_req_zone $vl_ip_limit_key      zone=vl_ip:10m      rate=2r/s;
