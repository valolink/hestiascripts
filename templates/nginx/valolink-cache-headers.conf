# Valolink: cache-header defaults for HTML and for code assets.
#
# Deployed to /etc/nginx/conf.d/valolink-cache-headers.conf by
# setup/install-cache-headers.sh (called from install-scripts.sh, so
# v-hestiascripts-update rolls it out, and from run.sh -> 12).
#
# Declared at http level, which means the wp-rocket and wp-secure templates can
# reference $vl_asset_expires without each per-domain server block re-declaring
# a map (that would be a fatal duplicate "..." variable). The install order is
# load-bearing: this file must land BEFORE any template that references it, or
# nginx refuses to start on "unknown vl_asset_expires variable". Both installers
# enforce that ordering.
#
# ---------------------------------------------------------------------------
# PART 1 - a default Cache-Control for HTML that carries none
# ---------------------------------------------------------------------------
# The wp-rocket template answers a cache hit with `try_files $rocket_file`, so
# nginx serves WP Rocket's pre-built page as a plain static file: ETag and
# Last-Modified, and no Cache-Control at all.
#
# That is not "do not cache". RFC 9111 4.2.2 permits a heuristic lifetime, and
# every major browser uses ~10% of the document's age, so a page built a week
# ago is reused for ~17 hours without ever revalidating.
#
# energiatuote.fi had this header for years -- LiteSpeed's LSCache always sends
# it -- and lost it in the move to nginx with nothing to replace it.

# Is this response HTML? Matches "text/html" and "text/html; charset=UTF-8".
map $sent_http_content_type $vl_is_html {
    default       0;
    ~*^text/html  1;
}

# HTML *and* nothing has set Cache-Control already? The map source is the two
# values joined by a colon, so "1:" is html with an empty Cache-Control.
#
# This only ever fills a gap, it never overrides:
#   - WordPress sends its own on cart / checkout / my-account via @backend.
#     Appending a second header would merge into one comma-joined list per
#     RFC 9110 5.3 and could clobber a deliberate max-age.
#   - `expires` sets one on static assets, and runs before add_header in the
#     same filter, so it is already visible here.
#
# nginx omits add_header entirely when its value is an empty string, which is
# what makes this a conditional without needing `if`.
map "$vl_is_html:$sent_http_cache_control" $vl_html_cache_control {
    default  "";
    "1:"     "no-cache, must-revalidate, max-age=0";
}

# `always` so error pages are covered -- a 404 is HTML and equally must not be
# pinned in a browser cache.
#
# no-cache means "store it, but revalidate before reuse", NOT "do not store":
# the ETag still earns cheap 304s, so this costs a conditional request, not
# bandwidth. no-store would be the directive that forbids keeping a copy.
#
# `private` is intentionally omitted -- it would also stop a CDN caching HTML,
# which is a separate decision from fixing browser heuristic caching.
add_header Cache-Control $vl_html_cache_control always;

# ---------------------------------------------------------------------------
# PART 2 - long asset caching only for URLs that can actually be busted
# ---------------------------------------------------------------------------
# The asset block in every Hestia proxy template (stock default.tpl included)
# ends with `expires max`, i.e. Cache-Control: max-age=315360000 -- ten years,
# no revalidation -- applied regardless of whether the URL carries a version.
#
# For an asset enqueued WITHOUT a version that is a trap, because the URL never
# changes: update the plugin, the bytes on disk change, and every returning
# browser keeps executing its decade-old copy. A normal reload does not help --
# it revalidates the document but serves subresources from cache while their
# max-age holds. Only a hard reload bypasses subresources, which is exactly the
# "broken until I hard-refresh" report.
#
# Measured on energiatuote.fi 2026-09-02: 27 of 31 /wp-content/ script and style
# tags had no ?ver= at all, including wc-blocks-middleware.js, wc-settings.js,
# wc-blocks-data.js and add-to-cart.min.js. WooCommerce was updated the previous
# day, so every returning customer was running yesterday's cart JavaScript.
#
# Applied to .css/.js only. Images, fonts and media keep `expires max`: stale
# media does not break a site, media URLs change when the file is re-uploaded,
# and /wp-content/uploads carries no ?ver=, so including it here would put a
# large revalidation load on every image for no correctness gain.
map $args $vl_asset_expires {
    default       1h;
    "~(^|&)ver="  max;
}
