# hs: scanner jail (templates/fail2ban/vl-scanner-jail.conf), installed by
# `hs op f2b-scanner-jail`. `hs f2b repair` adds ignoreip for this box's own
# addresses.
#
# 40 non-asset 404s within 5 minutes from one address. Tuned on 2026-10-09
# against two days of logs on six boxes: everything above that line was a
# scanner (pearcmd/LFI probes, /.env, webshell names, backup archives), no
# visitor or real crawler came near it. One hzweb1 pair was costing four
# php-fpm workers around the clock rendering WordPress 404 pages.
[vl-scanner]
enabled   = true
filter    = vl-scanner
logpath   = /var/log/apache2/domains/*.log
backend   = polling
# Web ports only: a ban here never closes SSH or the panel, so a false
# positive cannot lock anyone out of the box.
port      = http,https
banaction = iptables-multiport
maxretry  = 40
findtime  = 300
# An hour, doubling for each repeat (fail2ban keeps the history), up to a week.
bantime   = 3600
bantime.increment = true
bantime.maxtime   = 604800

# recidive turns 5 bans from any jail into a 10-day ban on every port,
# SSH included. Scanner bans stay web-only: they never feed it.
[recidive]
ignoreregex = \[vl-scanner\]
