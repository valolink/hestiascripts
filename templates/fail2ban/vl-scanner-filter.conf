# hs: vulnerability scanners (templates/fail2ban/vl-scanner-filter.conf)
#
# Counts requests that end in 403/404/444 for anything but a static asset:
# /wp/?pagename=…pearcmd, /.env, /alfa.php, /backup.zip and the like. A
# missing image or stylesheet on a page does not count, so a visitor on a page
# with broken assets never adds up. Read from the per-domain access logs
# (Hestia's nginx and Apache both write the client address there).
[Definition]
_static = css|js|mjs|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|map|mp4|webm|mp3|pdf
failregex = ^<HOST> \S+ \S+ \[\] "[A-Z]+ (?![^" ]*\.(?:%(_static)s)(?:\?[^" ]*)? )[^" ]+ HTTP/[0-9.]+" (?:403|404|444) 
# Search crawlers re-checking old URLs after a site change, and our own
# monitors: Uptime Kuma, and EngineLink's probes (the daily deep probe follows
# up to 60 links per site from one address, and this jail counts per address
# across every site on the box). A scanner spoofing these agents escapes this
# jail, nothing more.
ignoreregex = "[^"]*(?:Googlebot|bingbot|Applebot|Uptime-Kuma|EngineLink-Probe)[^"]*"\s*$
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
