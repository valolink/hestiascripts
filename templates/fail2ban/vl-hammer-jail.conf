# Valolink 2026-10-01: jail IPs that keep hitting the nginx per-IP limit on
# uncached requests (zone vl_ip, templates/nginx/valolink-crawlers.conf).
# 20 rejected requests within a minute means sustained > 2.3 req/s of PHP
# work from one address. Crawlers are not in vl_ip; they only get 429s.
# Repeat offenders escalate through the recidive jail.
#
# Installed as /etc/fail2ban/jail.d/vl-hammer.conf. The glob is safe: only
# domains that include crawlers-domain.conf log vl_ip lines. fail2ban expands
# it at start, so reload the jail after opting a new domain in. (soutuveneet
# lists its two opted-in domains explicitly instead.)
[vl-hammer]
enabled  = true
filter   = nginx-limit-req[ngx_limit_req_zones="vl_ip"]
logpath  = /var/log/apache2/domains/*.error.log
backend  = polling
port     = http,https
maxretry = 20
findtime = 60
bantime  = 3600
