# hs: WordPress jail (templates/fail2ban/wordpress-jail.conf). `hs f2b repair`
# adds ignoreip for this box's own addresses — see internal/f2b.
[wordpress]
enabled  = true
filter   = wordpress
# Both HestiaCP layouts: the system-wide path (fresh installs) and the
# per-user one (nginx writing into the user's web/<domain>/logs/).
logpath  = /var/log/nginx/domains/*.log
           /home/*/web/*/logs/*.log
backend  = polling
# Slow brute force without annoying customers who fat-finger a password: the
# original 10-in-60s let one attempt every ~10 s through indefinitely; an
# hour-long window catches sustained guessing.
maxretry = 10
findtime = 3600
bantime  = 86400
