# hestiascripts-tuned — low-footprint profile (templates/netdata/netdata.conf,
# installed by `hs op netdata-tune`; the previous file is kept under
# /var/lib/hs/backups). Health engine stays ON: EngineLink's alarm polling reads it.

[global]
    update every = 2

[ml]
    enabled = no

[db]
    mode = dbengine
    storage tiers = 1
    dbengine page cache size MB = 32
    dbengine multihost disk space MB = 512

[health]
    enabled = yes
