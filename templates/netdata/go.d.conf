# hs: go.d collectors run only when named under modules (templates/netdata/
# go.d.conf, installed by `hs op netdata-tune`; the previous file is kept
# under /var/lib/hs/backups).
#
# With default_run on, go.d's service discovery finds Apache, nginx and
# PHP-FPM listening on every address and starts a job against each status
# page. Hestia serves none of them, and the 2.12 nightly retried each failed
# job about 300 times a second (viona, 18.10.2026): the connection tracker
# near full, memory pressure, 4.3 GB of Apache errors a day. EngineLink's
# charts and the hs alarms read only the built-in proc charts, so nothing
# here needs go.d. To turn one back on, add it:
#
#   modules:
#     mysql: yes
enabled: yes
default_run: no
max_procs: 0
