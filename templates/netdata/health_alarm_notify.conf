# hs: Netdata mails only critical alarms (templates/netdata/
# health_alarm_notify.conf, installed by `hs op netdata-alarms`; the previous
# file is kept under /var/lib/hs/backups). Netdata reads the stock file first
# and this one after it, so only what is set here changes.
#
# "root" goes to tuotanto@ through /etc/aliases. "|critical" sends a
# recipient critical alarms and their recovery, never warnings: the fleet
# mailed about 28 a day, nearly all warnings that cleared within minutes
# (19.10.2026). Warnings stay in Netdata's API, so EngineLink's alarm list
# still shows them.
DEFAULT_RECIPIENT_EMAIL="root|critical"
