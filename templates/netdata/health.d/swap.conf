# hs: swap alarms (templates/netdata/health.d/swap.conf, installed by
# `hs op netdata-alarms`; the previous file is kept under /var/lib/hs/backups).
#
# This file carries the stock file's name on purpose: a file in the
# operator's health.d takes the place of the stock file with the same name.
# The stock swap.conf's used_swap fired on how full the swap file is. Pages
# parked there during an old peak stay until something needs them, so a full
# file says nothing about pressure — kuumalahde 2026-09-30 read 94 % used
# with nothing moving and 3 GB of RAM available. Swap that MOVES is the
# signal, so that is what is alarmed on. Memory pressure itself is in
# hs-pressure.conf; the stock ram_available and oom_kill alarms stay.

# Swap traffic, in + out (absolute: the out dimension is stored negative),
# averaged over the last three minutes so a reclaim burst does not count.
# 1 MiB/s sustained means the working set no longer fits and pages are being
# fetched back under load; 8 MiB/s is a box thrashing on an SSD.
      alarm: hs_swap_io
         on: mem.swapio
      class: Workload
       type: System
  component: Memory
     lookup: average -3m unaligned absolute
      units: KiB/s
      every: 30s
       warn: $this > (($status >= $WARNING)  ? (512)  : (1024))
       crit: $this > (($status == $CRITICAL) ? (4096) : (8192))
      delay: down 5m
    summary: Swap traffic
       info: Average swap in+out over the last 3 minutes; parked swap moves nothing
         to: sysadmin
