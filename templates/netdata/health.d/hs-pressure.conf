# hs: alarms on real memory and CPU pressure (templates/netdata/health.d/
# hs-pressure.conf, installed by `hs op netdata-alarms`; the previous file is
# kept under /var/lib/hs/backups).
#
# These read the kernel's pressure stall information (/proc/pressure, the
# system.*_pressure charts): the share of recent time in which tasks were
# stalled waiting for a resource. "some" = at least one task, "full" = every
# non-idle task at once. Both read 0.00 on a healthy web box, so the
# thresholds are not tuned to a workload — any sustained value is real.
# The 60 s and 300 s dimensions are the kernel's own moving averages, so no
# lookup window is needed. Names start with hs_ so EngineLink's alarm list
# tells them from the stock ones. The charts exist only on kernels with PSI
# (Debian 12 has it); without them Netdata simply creates no alarm.

# Some task waited for memory (reclaim, swap-in) this share of the last
# minute. 20 % is a box that has started to swap under load; 50 % is one
# spending half its time on reclaim.
      alarm: hs_ram_pressure
         on: system.memory_some_pressure
      class: Utilization
       type: System
  component: Memory
       calc: ${some 60}
      units: %
      every: 10s
       warn: $this > (($status >= $WARNING)  ? (10) : (20))
       crit: $this > (($status == $CRITICAL) ? (30) : (50))
      delay: down 5m
    summary: Memory pressure (some)
       info: Share of the last minute in which some task waited for memory
         to: sysadmin

# Every task waited for memory this share of the last minute: nothing makes
# progress, requests hang. 5 % is already felt in every request; at 20 %
# the OOM killer is next.
      alarm: hs_ram_stall
         on: system.memory_full_pressure
      class: Utilization
       type: System
  component: Memory
       calc: ${full 60}
      units: %
      every: 10s
       warn: $this > (($status >= $WARNING)  ? (2)  : (5))
       crit: $this > (($status == $CRITICAL) ? (10) : (20))
      delay: down 5m
    summary: Memory stall (full)
       info: Share of the last minute in which every task waited for memory
         to: sysadmin

# Runnable tasks waited for a CPU this share of the last five minutes. A
# traffic spike saturates the CPUs for a minute and is normal; five minutes
# at 30 % is a capacity problem (the stock 10min_cpu_usage alarm measures
# utilization; this measures the waiting it causes).
      alarm: hs_cpu_pressure
         on: system.cpu_some_pressure
      class: Utilization
       type: System
  component: CPU
       calc: ${some 300}
      units: %
      every: 30s
       warn: $this > (($status >= $WARNING)  ? (20) : (30))
       crit: $this > (($status == $CRITICAL) ? (50) : (70))
      delay: down 10m
    summary: CPU pressure
       info: Share of the last five minutes in which runnable tasks waited for a CPU
         to: sysadmin
