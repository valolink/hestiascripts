        # --- START: Valolink security rules ---
        #
        # Injected into <Directory %docroot%> of Hestia's Apache template by
        # setup/nginx-templates.sh. Companion to templates/nginx/wp-secure-snippet.conf:
        # the nginx snippet answers missing fonts and images at the proxy, this one
        # answers PHP probes and secret-hunting behind it.
        #
        # WordPress routes every non-existent path to index.php, so a bot probing
        # /1.php costs a full WordPress boot plus a themed 404 page. Measured on
        # kuumalahde 2026-08-28: 7,066 such requests over 5 days, 8.7GB rendered,
        # none of which could ever have been a real visitor.
        #
        # The !-f guard is what makes these safe: they can only fire for a file
        # that does not exist. If it exists, nothing here changes its handling.
        # Note this assumes a single-site install — on multisite, rewrites can
        # legitimately map a non-existent .php path onto a real file, so check
        # wp-config.php for MULTISITE before applying there.

        RewriteEngine On

        # Secrets, VCS metadata and editor leftovers — refused even if present,
        # because none of them should ever be served.
        RewriteRule (^|/)\.(env|git|svn|hg|aws|ssh)(/|$)           - [R=404,L]
        RewriteRule \.(sql|bak|old|orig|save|swp|swo|tar|tgz|zip)$ - [R=404,L]

        # Non-existent PHP. On a pretty-permalink WordPress site a real visitor
        # never requests one; scanners do it about 1,300 times a day.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule \.php$ - [R=404,L]

        # Backstop for fonts and images, for sites served by Apache directly
        # rather than through the nginx proxy. Same exclusion of css/js applies.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule \.(woff2?|ttf|otf|eot|svg|gif|png|jpe?g|webp|avif|ico)$ - [R=404,L]

        # --- END: Valolink security rules ---
