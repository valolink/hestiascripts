PROFILE_DESC="Staging / dev — ondemand, minimal resource use, yields to production"
PM_MODE="ondemand"
PM_MAX_CHILDREN=4
PM_IDLE_TIMEOUT="10s"
PM_MAX_REQUESTS=500
# Copies share the box with the live site: their workers run at nice 10, so
# production gets the CPU first under load, and PHP memory is capped per
# request (php_admin_value, not raisable by the site). 2026-09-30, kuumalahde.
PROCESS_PRIORITY=10
PHP_MEMORY_LIMIT="512M"
